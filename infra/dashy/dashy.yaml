pageInfo:
  title: Wavecat
  description: Home lab
# Opening method per item: workspace shows the app inside Dashy (works when the app allows framing),
# newtab for apps that send X-Frame-Options / frame-ancestors headers (see docs/todo.md item 27).
appConfig:
  theme: dark
  statusCheck: true
  statusCheckInterval: 60
  defaultOpeningMethod: newtab
  # Dashy 4.8.0 workspace view with the header hidden: the frame is sized 100% minus the header height, an empty 16px <header>
  # strip still takes space at the top, and the page has a -3px top margin, so the frame overshoots (page scrollbar) or stops short.
  customCss: '.web-content iframe{height:100%!important} body:has(.work-space) header{display:none} html:has(.work-space){margin:0}'
