apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ddns
  namespace: argocd
spec:
  destination:
    namespace: ddns
    server: "https://kubernetes.default.svc"
  project: infra
  sources:
    - repoURL: https://github.com/sweeneytr/wavecat.git
      path: infra/ddns
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
