apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dns
  namespace: argocd
spec:
  destination:
    namespace: dns
    server: "https://kubernetes.default.svc"
  project: infra
  sources:
    - repoURL: https://github.com/sweeneytr/wavecat.git
      path: infra/dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
