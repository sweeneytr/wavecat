apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  destination:
    namespace: monitoring
    server: "https://kubernetes.default.svc"
  project: infra
  sources:
    - repoURL: "https://grafana.github.io/helm-charts"
      chart: grafana
      targetRevision: 7.3.12
      helm:
        releaseName: grafana
        values: |-
          image:
            tag: 13.2.5
          admin:
            existingSecret: grafana-creds
          deploymentStrategy:
            type: Recreate
          grafana.ini:
            server:
              root_url: "https://grafana.wavecat.net"
            feature_toggles:
              enable: accessTokenExpirationCheck
            users:
              viewers_can_edit: true
            snapshots:
              external_enabled: false
          # Off: Grafana 13 refuses to start with the renderer's default token, and nothing here renders images (no alert rules).
          imageRenderer:
            enabled: false
          networkPolicy:
            enabled: true
          ingress:
            enabled: true
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt
              traefik.ingress.kubernetes.io/router.middlewares: dashy-embed-dashy@kubernetescrd
            hosts:
              - grafana.wavecat.net
            tls:
              - secretName: grafana-tls
                hosts:
                  - grafana.wavecat.net
          persistence:
            enabled: true
            storageClassName: wavecat
    - repoURL: "https://grafana.github.io/helm-charts"
      chart: alloy
      targetRevision: 1.15.0
      helm:
        releaseName: alloy
        values: |
          # Replaces grafana-agent (end of life). Config lives in infra/monitoring/alloy; the host network gives node-exporter the real NIC.
          # Port 12346 (not 12345) so it can run next to the old agent during the cutover.
          alloy:
            configMap:
              create: false
              name: alloy
              key: .
            clustering:
              enabled: true
            listenPort: 12346
            enableReporting: false
            mounts:
              varlog: true
              extra:
                - name: proc
                  mountPath: /host/proc
                  readOnly: true
                - name: sys
                  mountPath: /host/sys
                  readOnly: true
                - name: run
                  mountPath: /host/run
                  readOnly: true
                - name: root
                  mountPath: /host/root
                  readOnly: true
                  mountPropagation: HostToContainer
            securityContext:
              privileged: true
              runAsUser: 0
          controller:
            type: daemonset
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet
            volumes:
              extra:
                - name: proc
                  hostPath:
                    path: /proc
                - name: sys
                  hostPath:
                    path: /sys
                - name: run
                  hostPath:
                    path: /run
                - name: root
                  hostPath:
                    path: /
          rbac:
            clusterRules:
              - apiGroups: [""]
                resources: ["nodes"]
                verbs: ["get", "list", "watch"]
              - apiGroups: [""]
                resources: ["nodes/pods"]
                verbs: ["get", "list", "watch"]
              - apiGroups: [""]
                resources: ["nodes/metrics"]
                verbs: ["get", "list", "watch"]
              # Needed for the kubelet and cAdvisor scrapes, which go through the API server proxy (kube_metrics.alloy).
              - apiGroups: [""]
                resources: ["nodes/proxy"]
                verbs: ["get"]
              - nonResourceURLs: ["/metrics"]
                verbs: ["get"]
          configReloader:
            resources:
              requests:
                cpu: null
                memory: null
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
