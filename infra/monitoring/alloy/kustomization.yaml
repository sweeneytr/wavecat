apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: alloy
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/name: alloy
    files:
      - config.alloy
      - logs.alloy
      - pods.alloy
      - kube_state_metrics.alloy
      - pod_metrics.alloy
      - host_metrics.alloy
      - kube_metrics.alloy