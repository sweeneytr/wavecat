usage_report:
  reporting_enabled: false
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
server:
  http_listen_port: 8080
storage:
  trace:
    backend: local
    local:
      path: /data/traces
    wal:
      path: /data/wal

live_store:
  shutdown_marker_dir: /data/live-store/shutdown-marker
  wal:
    path: /data/live-store/traces

metrics_generator:
  storage:
    remote_write:
      - url: http://mimir/api/v1/push
        headers:
          X-Scope-OrgID: vanguard

overrides:
  defaults:
    compaction:
      block_retention: 24h
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics
