# Subnet router for the home network, as a Tailscale 4via6 route (site 1). Tailnet devices reach the home IPv4 range
# 192.168.128.0/22 (host and Pi 128.x, MetalLB 129.x: Traefik .0, Plex .1, Samba .8, DNS .53; game server 130.x) through IPv6 addresses:
#   192.168.A.B  ->  fd7a:115c:a1e0:b1a:0:1:c0a8:<A in hex><B in hex>   (see `tailscale debug via 1 <cidr>` in the connector pod)
# Because the route is IPv6 it never overrides or collides with an IPv4 network a device is on, at home or away.
# Names come from infra/dns (CoreDNS), set as the Split DNS nameserver for wavecat.net in the Tailscale admin console.
# Auto-approved by the tailnet policy (autoApprovers for tag:k8s); access is limited by grants in the tailnet policy.
apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: wavecat-router
spec:
  hostname: wavecat-router
  subnetRouter:
    advertiseRoutes:
      - fd7a:115c:a1e0:b1a:0:1:c0a8:8000/118
