apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
  namespace: media-server
  annotations:
    # Plex reads its certificate only at startup; Reloader restarts it when cert-manager renews the secret.
    secret.reloader.stakater.com/reload: plex-direct-tls
spec:
  selector:
    matchLabels:
      app: plex
  strategy:
    type: Recreate # This makes sure only one instance is running at a time
  template:
    metadata:
      labels:
        app: plex
    spec:
      containers:
        - name: plex
          image: lscr.io/linuxserver/plex:1.43.5.11029-6bf8af3f0-ls329
          env:
            - name: PUID
              value: "100"
            - name: PGID
              value: "100"
            - name: TZ
              value: America/New_York
          ports:
            - containerPort: 32400
              name: http
            - containerPort: 1900
              protocol: UDP
            - containerPort: 32469
            - containerPort: 5353
              protocol: UDP
            - containerPort: 8324
            - containerPort: 32410
              protocol: UDP
            - containerPort: 32412
              protocol: UDP
            - containerPort: 32413
              protocol: UDP
            - containerPort: 32414
              protocol: UDP
          volumeMounts:
            - name: config-pv
              mountPath: /config
            - name: data-pv
              mountPath: /data
            - name: plex-direct-tls
              mountPath: /certs
              readOnly: true
      securityContext:
        fsGroup: 100
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config-pv
          persistentVolumeClaim:
            claimName: plex-config
        - name: data-pv
          persistentVolumeClaim:
            claimName: media-pvc-2
        - name: plex-direct-tls
          secret:
            secretName: plex-direct-tls
            items:
              - key: keystore.p12
                path: keystore.p12
