apiVersion: v1
kind: Service
metadata:
  name: plex
  namespace: media-server
spec:
  selector:
    app: plex
  type: LoadBalancer
  # Keep the real client address. With the default (Cluster) every LAN client reaches Plex as 10.42.0.1, Plex registers
  # remote-control "players" at that address, and its Companion proxy then calls itself on 127.0.0.1:32400 in a loop
  # (bursts of about 4,000 requests every ~33 minutes that stall the server). Traefik uses Local for the same reason.
  # Single node and MetalLB in ARP mode, so Local is safe here. Revert if Plex starts labelling LAN clients as remote.
  externalTrafficPolicy: Local
  ports:
    - name: http
      port: 32400
      targetPort: http
    # The same web app and API on 443, so plex.wavecat.net can point at this address (192.168.129.1) for both 443 and 32400.
    # Plex serves its own certificate for plex.wavecat.net on this port (see certificate.yaml), so TLS ends at Plex.
    - name: https
      port: 443
      targetPort: http
    - name: plex-dlna
      port: 32469
      targetPort: 32469
    - name: udp-plex-dlna
      protocol: UDP
      port: 1900
      targetPort: 1900
    - name: udp-bonjour-avahi
      protocol: UDP
      port: 5353
      targetPort: 5353
    - name: plex-companion
      port: 8324
      targetPort: 8324
    - name: udp-gdm-discovery-1
      protocol: UDP
      port: 32410
      targetPort: 32410
    - name: udp-gdm-discovery-2
      protocol: UDP
      port: 32412
      targetPort: 32412
    - name: udp-gdm-discovery-3
      protocol: UDP
      port: 32413
      targetPort: 32413
    - name: udp-gdm-discovery-4
      protocol: UDP
      port: 32414
      targetPort: 32414
