apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: media-server
spec:
  selector:
    matchLabels:
      app: prowlarr
  strategy:
    type: Recreate # This makes sure only one instance is running at a time
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      # Prowlarr never talks to the Kubernetes API.
      automountServiceAccountToken: false
      initContainers:
        - name: init-config
          image: dibi/envsubst:1@sha256:6f1938ec2114e98406b9dcc638929fcbe68add3d94eb8629e0cbed03b72f09f8
          command: ['sh', '-c', "envsubst < /tmp/config/config.template.xml > /config/config.xml"]
          # Same user as Prowlarr (PUID/PGID below), so it owns config.xml and needs no capabilities.
          securityContext:
            runAsUser: 100
            runAsGroup: 100
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: POSTGRES_HOST
              value: 'media-server-cluster'
            - name: POSTGRES_PORT
              value: '5432'
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: prowlarr-owner.media-server-cluster.credentials.postgresql.acid.zalan.do
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: prowlarr-owner.media-server-cluster.credentials.postgresql.acid.zalan.do
                  key: password
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: prowlarr-apikey
                  key: apikey
          volumeMounts:
            - name: configmap-volume
              mountPath: /tmp/config
            - name: config-pv
              mountPath: /config
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:2.6.5.5623-ls165
          env:
            - name: PUID
              value: "100"
            - name: PGID
              value: "100"
            - name: TZ
              value: America/New_York
          ports:
            - containerPort: 8080
              name: http
          # The linuxserver image starts as root (s6) and drops to PUID/PGID, so it keeps just the
          # capabilities s6 needs to chown /config, switch user and supervise the service.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "KILL", "SETGID", "SETUID"]
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config-pv
              mountPath: /config
      securityContext:
        fsGroup: 100
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config-pv
          persistentVolumeClaim:
            claimName: prowlarr-config
        - name: configmap-volume
          configMap:
            name: prowlarr-config
