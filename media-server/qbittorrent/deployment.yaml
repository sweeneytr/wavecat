apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media-server
spec:
  selector:
    matchLabels:
      app: qbittorrent
  strategy:
    type: Recreate # This makes sure only one instance is running at a time
  template:
    metadata:
      labels:
        app: qbittorrent
        istio-ignore: 'yes'
    spec:
      initContainers:
      # The SSO login (oauth2-proxy on the ingress) is the only gate: skip qBittorrent's own
      # password for clients on the pod network (Traefik is one). The image has no env var for
      # this and qBittorrent rewrites its config file, so patch the file before each start.
      - name: webui-auth-subnet
        image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
        command:
        - sh
        - -c
        - |
          F=/config/qBittorrent/qBittorrent.conf
          [ -f "$F" ] || exit 0
          grep -v '^WebUI\\AuthSubnetWhitelist' "$F" | awk '{print} /^\[Preferences\]/{print "WebUI\\AuthSubnetWhitelistEnabled=true"; print "WebUI\\AuthSubnetWhitelist=10.42.0.0/16"}' > "$F.new"
          cat "$F.new" > "$F" && rm "$F.new"
        securityContext:
          runAsUser: 100
          runAsGroup: 100
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: config-pv
          mountPath: /config
      containers:
      - name: qbittorrent
        image: dyonr/qbittorrentvpn
        env:
        - name: PUID
          value: "100"
        - name: PGID
          value: '100'
        - name: VPN_ENABLED
          value: 'yes'
        - name: VPN_TYPE
          value: wireguard
        - name: LAN_NETWORK
          value: 192.168.0.0/26
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: config-pv
          mountPath: /config
        - name: data-pv
          mountPath: /data
        - name: wireguard-config
          mountPath: /config/wireguard
      securityContext:
        fsGroup: 100
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: config-pv
        persistentVolumeClaim:
          claimName: qbittorrent-config
      - name: data-pv
        persistentVolumeClaim:
          claimName: media-pvc-2
      - name: wireguard-config
        secret:
          secretName: wireguard-config-secret
